<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Reader</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/%3E%3Cpath d='M14 2v6h6M8 13h8M8 17h5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/hljs-github.min.css" id="hljs-light">
  <link rel="stylesheet" href="/static/vendor/hljs-github-dark.min.css" id="hljs-dark" disabled>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btn-toggle-tree" title="Toggle file tree" aria-label="Toggle file tree">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
    <button class="root-btn" id="btn-open-dir" title="Choose a directory">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span id="root-label">Choose directory…</span>
    </button>
    <span class="spacer"></span>
    <span class="badge" title="This viewer never modifies files">read-only</span>
    <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings" aria-haspopup="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div class="popover" id="settings" hidden>
      <label><input type="checkbox" data-setting="showHidden"> Show hidden files</label>
      <label><input type="checkbox" data-setting="wrap"> Wrap long lines</label>
      <label><input type="checkbox" data-setting="lineNumbers"> Line numbers</label>
      <label><input type="checkbox" data-setting="autoRefresh"> Auto-refresh when file changes</label>
      <label title="Scripts run in a sandbox with no access to this app"><input type="checkbox" data-setting="htmlScripts"> Run scripts in HTML files</label>
      <div class="setting-row">
        <span>Theme</span>
        <select data-setting="theme">
          <option value="auto">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <div class="setting-row">
        <span>Font size</span>
        <select data-setting="fontSize">
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="16">16</option>
          <option value="18">18</option>
        </select>
      </div>
    </div>
  </header>

  <main class="layout" id="layout">
    <aside class="tree-panel" id="tree-panel">
      <div class="panel-head">
        <span class="panel-title" id="tree-title">Files</span>
        <button class="icon-btn small" id="btn-collapse-all" title="Collapse all" aria-label="Collapse all">
          <svg viewBox="0 0 24 24"><path d="m7 20 5-5 5 5M7 4l5 5 5-5"/></svg>
        </button>
        <button class="icon-btn small" id="btn-refresh-tree" title="Refresh tree" aria-label="Refresh tree">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
      <div class="search-box">
        <input type="search" id="search" placeholder="Search files…  ( / )" autocomplete="off" spellcheck="false"
               aria-label="Search file names" aria-controls="search-results">
        <div class="search-status" id="search-status"></div>
      </div>
      <nav class="tree" id="tree" role="tree" aria-label="File tree"></nav>
      <ul class="search-results" id="search-results" role="listbox" aria-label="Search results" hidden></ul>
    </aside>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize · double-click to reset"></div>
    <section class="viewer-panel" id="viewer-panel">
      <div class="viewer-head" id="viewer-head" hidden>
        <div class="crumbs" id="crumbs"></div>
        <div class="viewer-meta" id="viewer-meta"></div>
        <div class="viewer-actions" id="viewer-actions"></div>
      </div>
      <div class="viewer" id="viewer">
        <div class="empty">
          <p>Choose a directory to start browsing.</p>
          <button class="btn primary" id="btn-empty-open">Choose directory</button>
        </div>
      </div>
    </section>
    <div class="scrim" id="scrim"></div>
  </main>

  <dialog class="picker" id="picker">
    <form method="dialog" class="picker-inner" id="picker-form">
      <div class="picker-head">
        <h2>Choose a directory</h2>
        <button class="icon-btn small" value="cancel" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="picker-path">
        <button type="button" class="icon-btn small" id="picker-up" title="Parent directory" aria-label="Parent directory">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <input type="text" id="picker-input" spellcheck="false" autocomplete="off" aria-label="Directory path">
        <button type="button" class="btn" id="picker-go">Go</button>
      </div>
      <div class="picker-quick" id="picker-quick"></div>
      <ul class="picker-list" id="picker-list"></ul>
      <div class="picker-foot">
        <label><input type="checkbox" id="picker-hidden"> Show hidden</label>
        <span class="spacer"></span>
        <button class="btn" value="cancel">Cancel</button>
        <button type="button" class="btn primary" id="picker-select">Open this directory</button>
      </div>
    </form>
  </dialog>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/vendor/highlight.min.js"></script>
  <script src="/static/vendor/hljs-extra-langs.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
